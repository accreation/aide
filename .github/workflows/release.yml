name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Build binaries for all platforms ──────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64,  ext: '' }
          - { goos: linux,   goarch: arm64,  ext: '' }
          - { goos: darwin,  goarch: amd64,  ext: '' }
          - { goos: darwin,  goarch: arm64,  ext: '' }
          - { goos: windows, goarch: amd64,  ext: '.exe' }
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY="aide-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build \
            -trimpath \
            -ldflags "-s -w -X aide/cmd.Version=${{ steps.version.outputs.VERSION }} -X aide/cmd.DefaultRecipesURL=https://accreation.github.io/aide/recipes.yaml" \
            -o "$BINARY" \
            .
          echo "BINARY=$BINARY" >> $GITHUB_ENV

      - name: Package (tar.gz — Linux / macOS)
        if: matrix.goos != 'windows'
        run: tar -czf "${BINARY}.tar.gz" "$BINARY"

      - name: Package (zip — Windows)
        if: matrix.goos == 'windows'
        run: zip "${BINARY}.zip" "$BINARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aide-${{ matrix.goos }}-${{ matrix.goarch }}
          path: aide-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.*
          if-no-files-found: error

  # ── Windows ARM64 (optional — runner availability is limited) ────
  build-windows-arm64:
    name: Build (windows/arm64)
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          BINARY="aide-windows-arm64.exe"
          go build \
            -trimpath \
            -ldflags "-s -w -X aide/cmd.Version=${{ steps.version.outputs.VERSION }} -X aide/cmd.DefaultRecipesURL=https://accreation.github.io/aide/recipes.yaml" \
            -o "$BINARY" \
            .
          echo "BINARY=$BINARY" >> $GITHUB_ENV

      - name: Package (zip)
        run: zip "${BINARY}.zip" "$BINARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aide-windows-arm64
          path: aide-windows-arm64.exe.*
          if-no-files-found: error

  # ── Linux packages (.deb / .rpm via nfpm) ────────────────────────
  linux-packages:
    name: Linux packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: aide-linux-${{ matrix.arch }}

      - name: Extract binary
        run: tar -xzf aide-linux-${{ matrix.arch }}.tar.gz

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq nfpm

      - name: Build .deb and .rpm
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          cat > nfpm.yaml << NFPMEOF
          name: aide
          arch: "${{ matrix.arch == 'amd64' && 'amd64' || 'arm64' }}"
          platform: linux
          version: "${VERSION}"
          section: utils
          priority: optional
          maintainer: "Aide Maintainers"
          description: |
            AI environment manager — check and install tools for your AI provider.
            Reads aide.yaml and verifies that your AI provider and all required
            tools are installed with correct versions.
          homepage: "https://github.com/${{ github.repository }}"
          license: MIT
          contents:
            - src: aide-linux-${{ matrix.arch }}
              dst: /usr/local/bin/aide
          NFPMEOF

          nfpm package --packager deb --target "aide_${VERSION}_${{ matrix.arch }}.deb"
          nfpm package --packager rpm --target "aide-${VERSION}-1.${{ matrix.arch }}.rpm"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: aide-linux-pkg-${{ matrix.arch }}
          path: |
            aide_*.deb
            aide-*.rpm
          if-no-files-found: error

  # ── Checksums ─────────────────────────────────────────────────────
  checksums:
    name: Generate checksums
    runs-on: ubuntu-latest
    needs: [build, linux-packages]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec sha256sum {} \; | sort -k2 > "aide_${{ github.ref_name }}_checksums.txt"

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/aide_*_checksums.txt
          if-no-files-found: error

  # ── GitHub Release ────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: checksums
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "aide ${{ github.ref_name }}"
          body: |
            ## 📦 Installation

            ### 🐧 Linux
            ```bash
            # .deb (Debian / Ubuntu)
            sudo dpkg -i aide_*_amd64.deb

            # .rpm (Fedora / RHEL)
            sudo rpm -i aide-*-1.amd64.rpm

            # Portable binary
            tar -xzf aide-linux-amd64.tar.gz
            sudo mv aide-linux-amd64 /usr/local/bin/aide
            ```

            ### 🍎 macOS
            ```bash
            # Apple Silicon (M1/M2/M3)
            tar -xzf aide-darwin-arm64.tar.gz
            sudo mv aide-darwin-arm64 /usr/local/bin/aide

            # Intel
            tar -xzf aide-darwin-amd64.tar.gz
            sudo mv aide-darwin-amd64 /usr/local/bin/aide
            ```

            ### 🪟 Windows
            ```powershell
            # One-liner installer (recommended)
            powershell -c "irm https://raw.githubusercontent.com/accreation/aide/main/install.ps1 | iex"

            # Or manually: extract and place in %USERPROFILE%\.local\bin\
            Invoke-WebRequest -Uri "https://github.com/accreation/aide/releases/latest/download/aide-windows-amd64.exe.zip" -OutFile aide.zip
            Expand-Archive aide.zip -DestinationPath .
            Move-Item -Path "aide-windows-amd64.exe" -Destination "$env:USERPROFILE\.local\bin\aide.exe" -Force
            ```

            ---
            SHA256 checksums are in `aide_${{ github.ref_name }}_checksums.txt`.
          files: |
            dist/aide-linux-amd64.tar.gz
            dist/aide-linux-arm64.tar.gz
            dist/aide-darwin-amd64.tar.gz
            dist/aide-darwin-arm64.tar.gz
            dist/aide-windows-amd64.exe.zip
            dist/aide-windows-*.exe.zip
            dist/aide_*_amd64.deb
            dist/aide_*_arm64.deb
            dist/aide-*-1.amd64.rpm
            dist/aide-*-1.arm64.rpm
            dist/aide_*_checksums.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          generate_release_notes: true

  # ── Publish to package managers ──────────────────────────────────
  publish:
    name: Publish to package managers
    runs-on: ubuntu-latest
    needs: release
    strategy:
      fail-fast: false
      matrix:
        manager: [homebrew, scoop, apt-dnf]
        # TODO: uncomment when ready:
        # manager: [homebrew, scoop, winget, chocolatey, apt-dnf]
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: artifacts

      - name: Install dependencies (apt-dnf)
        if: matrix.manager == 'apt-dnf'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq createrepo-c apt-utils

      # TODO: uncomment when winget PR is accepted
      # - name: Install dependencies (winget)
      #   if: matrix.manager == 'winget'
      #   uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '8.x'

      # TODO: uncomment when chocolatey API key + first submission done
      # - name: Install dependencies (chocolatey)
      #   if: matrix.manager == 'chocolatey'
      #   run: |
      #     # Install Mono (required by choco on Linux)
      #     sudo apt-get install -y -qq mono-complete

      - name: Publish (Homebrew)
        if: matrix.manager == 'homebrew'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHKSUM_FILE: artifacts/aide_*_checksums.txt
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: bash packaging/publish-homebrew.sh

      - name: Publish (Scoop)
        if: matrix.manager == 'scoop'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHKSUM_FILE: artifacts/aide_*_checksums.txt
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
        run: bash packaging/publish-scoop.sh

      # TODO: uncomment when winget PR is accepted
      # - name: Publish (Winget)
      #   if: matrix.manager == 'winget'
      #   env:
      #     VERSION: ${{ steps.version.outputs.VERSION }}
      #     WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
      #   run: bash packaging/publish-winget.sh

      # TODO: uncomment when chocolatey first submission done
      # - name: Publish (Chocolatey)
      #   if: matrix.manager == 'chocolatey'
      #   env:
      #     VERSION: ${{ steps.version.outputs.VERSION }}
      #     CHKSUM_FILE: artifacts/aide_*_checksums.txt
      #     CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      #   run: bash packaging/publish-choco.sh

      - name: Publish (APT/DNF)
        if: matrix.manager == 'apt-dnf'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          AIDE_REPO_DEPLOY_KEY: ${{ secrets.AIDE_REPO_DEPLOY_KEY }}
        run: bash packaging/publish-apt-dnf.sh
